name: DORA snapshot
on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'
permissions:
  contents: read
  deployments: read
  issues: read
  actions: read
jobs:
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r dora/requirements.txt
      - run: python dora/collect.py --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
      - run: python dora/render.py
      - uses: actions/upload-artifact@v4
        with:
          name: dora-${{ github.run_id }}
          path: dora/data/
          if-no-files-found: error
          retention-days: 90
